CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y        
CONFIG_BT_HCI=y                
CONFIG_BT_DEVICE_NAME="Iris3"  
         
# Enable the Bluetooth controller for Nordic Semiconductor
CONFIG_BT_LL_SW_SPLIT=y  # Use the split Link Layer architecture
CONFIG_BT_CTLR=y  # Enable the Bluetooth controller
CONFIG_BT_LLL_VENDOR_NORDIC=y  # Use Nordic's Low-Level Link Laye

CONFIG_NVS=y
CONFIG_NVS_LOG_LEVEL_DBG=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3    


          