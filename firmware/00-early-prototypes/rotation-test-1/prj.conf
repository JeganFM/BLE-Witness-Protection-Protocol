# Enable the core Bluetooth stack
CONFIG_BT=y

# Enable Bluetooth Peripheral role (for advertising)
CONFIG_BT_PERIPHERAL=y

# Enable Bluetooth Observer role (for scanning)
CONFIG_BT_OBSERVER=y

# Enable Bluetooth Host Controller Interface (HCI)
CONFIG_BT_HCI=y

# Enable the split Link Layer architecture (common for many platforms)
CONFIG_BT_LL_SW_SPLIT=y

# Enable the Bluetooth controller
CONFIG_BT_CTLR=y 

#Enable ring buffer
CONFIG_RING_BUFFER=y

# Enable basic logging for debugging
CONFIG_LOG=y

# Optional: Increase stack size for Bluetooth-related tasks
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_BT_RX_STACK_SIZE=1024
CONFIG_BT_HCI_TX_STACK_SIZE=1024

