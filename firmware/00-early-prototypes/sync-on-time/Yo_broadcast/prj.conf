# Enable the core Bluetooth stack
CONFIG_BT=y

# Enable Bluetooth peripheral role (for advertising)
CONFIG_BT_PERIPHERAL=y

# Enable Bluetooth Host Controller Interface (HCI)
CONFIG_BT_HCI=y

# Enable the Bluetooth controller for Nordic Semiconductor
CONFIG_BT_LL_SW_SPLIT=y  # Use the split Link Layer architecture
CONFIG_BT_CTLR=y  # Enable the Bluetooth controller
CONFIG_BT_LLL_VENDOR_NORDIC=y  # Use Nordic's Low-Level Link Layer

# Enable Bluetooth Extended Advertising (this will indirectly enable CONFIG_BT_CTLR_ADV_EXT_SUPPORT if all dependencies are met)
CONFIG_BT_EXT_ADV=y

# Enable logging for debugging (optional but useful)
CONFIG_LOG=y
CONFIG_BT_DEBUG_LOG=y

# Adjust the main stack size if necessary
CONFIG_MAIN_STACK_SIZE=1024

